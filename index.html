<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeVerse - منصة الأنمي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">ANIME<span>VERSE</span></div>
        <div class="header-controls">
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">أشهر أنميات العالم</h2>
        <div class="anime-grid" id="animeGrid">
            <div style="grid-column: span 2; text-align: center; color: #fff; padding: 40px;">جاري تحميل الأنميات... ⏳</div>
        </div>
    </div>

    <script>
        async function fetchAnime() {
            try {
                const response = await fetch('https://api.jikan.moe/v4/top/anime');
                const data = await response.json();
                const grid = document.getElementById('animeGrid');
                grid.innerHTML = '';
                
                data.data.forEach(anime => {
                    grid.innerHTML += `
                        <div class="anime-card">
                            <div class="anime-poster-wrapper">
                                <span class="anime-badge">⭐ ${anime.score || 'N/A'}</span>
                                <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
                            </div>
                            <div class="anime-details">
                                <div class="anime-name">${anime.title}</div>
                                <div class="anime-genres">${anime.type || 'TV'} (${anime.year || 'مستمر'})</div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('animeGrid').innerHTML = '<p style="color:red; text-align:center; grid-column:span 2;">فشل في تحميل البيانات، تأكد من اتصال الإنترنت.</p>';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('themeToggleBtn');
            btn.innerHTML = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        }

        window.addEventListener('DOMContentLoaded', fetchAnime);
    </script>
</body>
</html>
