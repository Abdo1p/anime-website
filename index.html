<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeVerse - منصة مشاهدة الأنمي الاحترافية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header>
        <div class="logo" onclick="location.reload()">ANIME<span>VERSE</span></div>
        <div class="header-controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن أنمي..." onkeyup="filterAnime()">
                <span>🔍</span>
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="container">
        
        <!-- تصنيفات سريعة -->
        <div class="categories-bar">
            <button class="cat-btn active" onclick="filterByCategory('الكل')">الكل</button>
            <button class="cat-btn" onclick="filterByCategory('أكشن')">أكشن</button>
            <button class="cat-btn" onclick="filterByCategory('خيال')">خيال</button>
            <button class="cat-btn" onclick="filterByCategory('شونين')">شونين</button>
            <button class="cat-btn" onclick="filterByCategory('مكتمل')">مكتمل</button>
            <button class="cat-btn" onclick="filterByCategory('أسطوري')">أسطوري</button>
        </div>

        <!-- قسم المشاهدة -->
        <div class="watch-container">
            <div class="player-card">
                <div class="video-wrapper">
                    <iframe id="mainPlayer" src="" allowfullscreen></iframe>
                </div>
                <div class="anime-meta">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h1 id="activeTitle" style="font-size: 18px; margin: 0;">اختر حلقة للمشاهدة</h1>
                        <button class="fav-btn" id="favBtn" onclick="toggleFavorite()">❤️ المفضلة</button>
                    </div>
                    <p id="activeDescription" style="font-size: 13px;">اختر أحد الأنميات وابدأ بالمشاهدة.</p>
                    
                    <div class="servers-section">
                        <span>السيرفرات:</span>
                        <div id="serversListContainer" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
                    </div>
                </div>
            </div>

            <!-- قائمة الحلقات -->
            <div class="episodes-sidebar">
                <div class="sidebar-header">
                    <span id="sidebarAnimeName">قائمة الحلقات</span>
                    <span style="font-size: 12px; color: var(--text-muted);" id="episodesCount">0 حلقة</span>
                </div>
                <div class="episodes-list" id="episodesListContainer">
                    <div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 13px;">
                        اختر أنمي من القائمة بالأسفل 🎬
                    </div>
                </div>
            </div>
        </div>

        <!-- قائمة الأنميات -->
        <h2 class="section-title">قائمة الأنميات المتاحة</h2>
        <div class="anime-grid" id="animeGrid"></div>

    </div>

    <script src="data.js"></script>
    <script>
        let currentAnimeId = null;
        let currentActiveEpisode = null;
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('themeToggleBtn');
            if (document.body.classList.contains('light-mode')) {
                btn.innerHTML = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                btn.innerHTML = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeToggleBtn').innerHTML = '☀️';
            }
            renderAnimeGrid(animeDatabase);
            if(animeDatabase.length > 0) loadAnime(animeDatabase[0].id);
        });

        function renderAnimeGrid(data) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '';
            data.forEach(anime => {
                grid.innerHTML += `
                    <div class="anime-card" onclick="loadAnime(${anime.id})">
                        <div class="anime-poster-wrapper">
                            <span class="anime-badge">${anime.badge}</span>
                            <img src="${anime.image}" alt="${anime.title}">
                        </div>
                        <div class="anime-details">
                            <div class="anime-name">${anime.title}</div>
                            <div class="anime-genres">${anime.genres}</div>
                        </div>
                    </div>
                `;
            });
        }

        function loadAnime(animeId) {
            currentAnimeId = animeId;
            const anime = animeDatabase.find(a => a.id === animeId);
            if (!anime) return;

            document.getElementById('sidebarAnimeName').innerText = anime.title;
            document.getElementById('episodesCount').innerText = `${anime.episodes.length} حلقة`;
            document.getElementById('activeDescription').innerText = anime.description;
            
            updateFavButtonState();

            const epContainer = document.getElementById('episodesListContainer');
            epContainer.innerHTML = '';

            anime.episodes.forEach((ep, index) => {
                const isActive = index === 0 ? 'active' : '';
                epContainer.innerHTML += `
                    <div class="episode-item ${isActive}" id="ep-${index}" onclick='selectEpisode(${JSON.stringify(ep)}, "${anime.title}", ${index}, this)'>
                        <div><div class="ep-num">${ep.title}</div></div>
                        <span class="ep-dur">${ep.duration}</span>
                    </div>
                `;
            });

            if (anime.episodes.length > 0) {
                selectEpisode(anime.episodes[0], anime.title, 0, epContainer.children[0]);
            }
        }

        function selectEpisode(epData, animeName, index, element) {
            currentActiveEpisode = epData;
            document.getElementById('activeTitle').innerText = `${animeName} - ${epData.title}`;

            let items = document.querySelectorAll('.episode-item');
            items.forEach(item => item.classList.remove('active'));
            if(element) element.classList.add('active');

            const serversContainer = document.getElementById('serversListContainer');
            serversContainer.innerHTML = '';

            epData.servers.forEach((server, sIndex) => {
                const isServerActive = sIndex === 0 ? 'active' : '';
                serversContainer.innerHTML += `
                    <button class="server-btn ${isServerActive}" onclick="changeServer('${server.url}', this)">
                        🖥️ ${server.name}
                    </button>
                `;
            });

            if(epData.servers.length > 0) {
                document.getElementById('mainPlayer').src = epData.servers[0].url;
            }
        }

        function changeServer(videoUrl, btnElement) {
            document.getElementById('mainPlayer').src = videoUrl;
            let sButtons = document.querySelectorAll('.server-btn');
            sButtons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function toggleFavorite() {
            const index = favorites.indexOf(currentAnimeId);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(currentAnimeId);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavButtonState();
        }

        function updateFavButtonState() {
            const btn = document.getElementById('favBtn');
            if (favorites.includes(currentAnimeId)) {
                btn.innerHTML = '❤️ بالمفضلة';
                btn.style.background = 'var(--accent)';
                btn.style.color = '#fff';
            } else {
                btn.innerHTML = '🤍 المفضلة';
                btn.style.background = 'var(--bg-card-hover)';
                btn.style.color = 'var(--text-main)';
            }
        }

        function filterAnime() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = animeDatabase.filter(anime => 
                anime.title.toLowerCase().includes(query) || anime.genres.toLowerCase().includes(query)
            );
            renderAnimeGrid(filtered);
        }

        function filterByCategory(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'الكل') {
                renderAnimeGrid(animeDatabase);
            } else {
                let filtered = animeDatabase.filter(anime => anime.genres.includes(category) || anime.badge.includes(category));
                renderAnimeGrid(filtered);
            }
        }
    </script>
</body>
</html>
