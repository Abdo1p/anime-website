<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeVerse - منصة مشاهدة الأنمي الاحترافية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header>
        <div class="logo" onclick="location.reload()">ANIME<span>VERSE</span></div>
        
        <div class="header-controls">
            <!-- خانة البحث -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن أنمي..." onkeyup="filterAnime()">
                <span>🔍</span>
            </div>
            
            <!-- زر تبديل الوضع الليلي / الفاتح -->
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
                🌙 الوضع الليلي
            </button>
        </div>
    </header>

    <div class="container">
        
        <!-- قسم المشاهدة والسيرفرات -->
        <div class="watch-container">
            <div class="player-card">
                <div class="video-wrapper">
                    <iframe id="mainPlayer" src="" allowfullscreen></iframe>
                </div>
                <div class="anime-meta">
                    <h1 id="activeTitle">اختر حلقة للمشاهدة</h1>
                    <p id="activeDescription">مرحباً بك في منصتك الخاصة. اختر أحد الأنميات أدناه وابدأ بالمشاهدة مع إمكانية التبديل بين سيرفرات العرض المختلفة.</p>
                    
                    <!-- أزرار اختيار السيرفرات -->
                    <div class="servers-section">
                        <span>سيرفرات المشاهدة:</span>
                        <div id="serversListContainer" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
                    </div>
                </div>
            </div>

            <!-- قائمة الحلقات -->
            <div class="episodes-sidebar">
                <div class="sidebar-header">
                    <span id="sidebarAnimeName">قائمة الحلقات</span>
                    <span style="font-size: 12px; color: var(--text-muted);" id="episodesCount">0 حلقة</span>
                </div>
                <div class="episodes-list" id="episodesListContainer">
                    <div style="text-align: center; color: var(--text-muted); margin-top: 60px;">
                        الرجاء اختيار أنمي من القائمة بالأسفل 🎬
                    </div>
                </div>
            </div>
        </div>

        <!-- قائمة الأنميات -->
        <h2 class="section-title">قائمة الأنميات المتاحة</h2>
        <div class="anime-grid" id="animeGrid"></div>

    </div>

    <!-- ربط ملف البيانات -->
    <script src="data.js"></script>

    <script>
        let currentActiveEpisode = null;

        // وظيفة تبديل الوضع (Light / Dark Mode)
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const btn = document.getElementById('themeToggleBtn');
            
            if (document.body.classList.contains('light-mode')) {
                btn.innerHTML = '☀️ الوضع الفاتح';
                localStorage.setItem('theme', 'light');
            } else {
                btn.innerHTML = '🌙 الوضع الليلي';
                localStorage.setItem('theme', 'dark');
            }
        }

        // التحقق من خيار المستخدم المحفوظ مسبقاً عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeToggleBtn').innerHTML = '☀️ الوضع الفاتح';
            }
        });

        // عرض الأنميات في الشبكة
        function renderAnimeGrid(data) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '';
            
            data.forEach(anime => {
                grid.innerHTML += `
                    <div class="anime-card" onclick="loadAnime(${anime.id})">
                        <div class="anime-poster-wrapper">
                            <span class="anime-badge">${anime.badge}</span>
                            <img src="${anime.image}" alt="${anime.title}">
                        </div>
                        <div class="anime-details">
                            <div class="anime-name">${anime.title}</div>
                            <div class="anime-genres">${anime.genres}</div>
                        </div>
                    </div>
                `;
            });
        }

        // تحميل الأنمي وعرض حلقاته
        function loadAnime(animeId) {
            const anime = animeDatabase.find(a => a.id === animeId);
            if (!anime) return;

            document.getElementById('sidebarAnimeName').innerText = anime.title;
            document.getElementById('episodesCount').innerText = `${anime.episodes.length} حلقة`;
            document.getElementById('activeDescription').innerText = anime.description;
            
            const epContainer = document.getElementById('episodesListContainer');
            epContainer.innerHTML = '';

            anime.episodes.forEach((ep, index) => {
                const isActive = index === 0 ? 'active' : '';
                epContainer.innerHTML += `
                    <div class="episode-item ${isActive}" id="ep-${index}" onclick='selectEpisode(${JSON.stringify(ep)}, "${anime.title}", ${index}, this)'>
                        <div>
                            <div class="ep-num">${ep.title}</div>
                        </div>
                        <span class="ep-dur">${ep.duration}</span>
                    </div>
                `;
            });

            if (anime.episodes.length > 0) {
                selectEpisode(anime.episodes[0], anime.title, 0, epContainer.children[0]);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // اختيار الحلقة وتوليد السيرفرات
        function selectEpisode(epData, animeName, index, element) {
            currentActiveEpisode = epData;
            document.getElementById('activeTitle').innerText = `${animeName} - ${epData.title}`;

            let items = document.querySelectorAll('.episode-item');
            items.forEach(item => item.classList.remove('active'));
            if(element) element.classList.add('active');

            const serversContainer = document.getElementById('serversListContainer');
            serversContainer.innerHTML = '';

            epData.servers.forEach((server, sIndex) => {
                const isServerActive = sIndex === 0 ? 'active' : '';
                serversContainer.innerHTML += `
                    <button class="server-btn ${isServerActive}" onclick="changeServer('${server.url}', this)">
                        🖥️ ${server.name}
                    </button>
                `;
            });

            if(epData.servers.length > 0) {
                document.getElementById('mainPlayer').src = epData.servers[0].url;
            }
        }

        // تبديل السيرفر
        function changeServer(videoUrl, btnElement) {
            document.getElementById('mainPlayer').src = videoUrl;
            let sButtons = document.querySelectorAll('.server-btn');
            sButtons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // نظام البحث الفوري
        function filterAnime() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = animeDatabase.filter(anime => 
                anime.title.toLowerCase().includes(query) || anime.genres.toLowerCase().includes(query)
            );
            renderAnimeGrid(filtered);
        }

        window.onload = function() {
            renderAnimeGrid(animeDatabase);
            loadAnime(animeDatabase[0].id);
        };
    </script>
</body>
</html>
